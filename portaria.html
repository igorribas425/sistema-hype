<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPE // Portaria & Validação</title>
<style>
  :root{--bg:#050505;--panel:#0d0d10;--line:#222228;--red:#ff163d;--green:#28d17c;--text:#f7f7f8;--muted:#96969e}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;padding-top:70px}
  .container{max-width:800px;margin:0 auto}
  
  .top-nav{position:fixed;top:0;left:0;width:100%;background:rgba(13,13,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:center;gap:15px;z-index:1000}
  .top-nav a{color:var(--muted);text-decoration:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);transition:.2s}
  .top-nav a:hover{color:#fff;border-color:var(--red);background:rgba(255,22,61,.05)}

  #loginScreen{position:fixed;inset:0;background:rgba(5,5,5,.95);z-index:9999;display:grid;place-items:center;padding:20px}
  .loginBox{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:20px;text-align:center}
  .loginBox input{width:100%;height:42px;background:#060608;border:1px solid var(--line);border-radius:9px;padding:0 12px;color:#fff;font-size:13px;outline:none;margin-bottom:12px}
  .loginBox input:focus{border-color:var(--green)}
  
  .btn{height:42px;background:var(--green);color:#000;border:0;border-radius:9px;font-weight:900;padding:0 20px;cursor:pointer;width:100%}
  .btn:hover{opacity:.85}

  header{text-align:center;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:30px}
  h1{font-size:26px;font-weight:950;letter-spacing:2px}
  h1 span{color:var(--red)}
  p.sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:5px}

  .search-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:25px}
  label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:8px;letter-spacing:1px}
  .search-input{width:100%;height:56px;background:#060608;border:2px solid var(--line);border-radius:12px;padding:0 18px;color:#fff;font-size:18px;outline:none}
  .search-input:focus{border-color:var(--green)}

  .results-grid{display:flex;flex-direction:column;gap:15px}
  
  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
  .result-card.pago{border-color:rgba(40,209,124,.4);background:linear-gradient(135deg,rgba(40,209,124,.05),var(--panel))}
  .result-card.pendente{border-color:rgba(255,22,61,.4);background:linear-gradient(135deg,rgba(255,22,61,.05),var(--panel))}

  .client-info h3{font-size:20px;font-weight:900;margin-bottom:6px;color:#fff}
  .client-details{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:center}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:900}
  .badge.gender{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line)}
  
  .status-tag{font-size:14px;font-weight:950;padding:10px 16px;border-radius:10px;text-transform:uppercase;letter-spacing:1px}
  .status-tag.pago{background:var(--green);color:#000}
  .status-tag.pendente{background:var(--red);color:#fff}

  .empty-state{text-align:center;padding:40px;color:var(--muted);font-size:14px}

  .portaria-actions{display:flex;gap:10px;margin-top:12px}
  .portaria-btn{height:46px;border:0;border-radius:10px;background:var(--green);color:#000;font-weight:950;padding:0 14px;cursor:pointer;flex:1}
  .portaria-btn.secondary{background:#161619;color:#fff;border:1px solid var(--line)}
  .scanner-area{display:none;position:relative;margin-top:14px;background:#000;border-radius:14px;overflow:hidden;padding:12px}
  .scanner-area.show{display:block}
  .scanner-area video{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:10px}
  .scanner-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--green);box-shadow:0 0 20px var(--green)}
  .scanner-area .portaria-btn{margin-top:10px}
  .status-area{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .btn-entry{border:0;border-radius:10px;background:var(--green);color:#000;font-weight:950;padding:12px 14px;cursor:pointer}
  .result-card.used{border-color:rgba(255,180,0,.45);background:linear-gradient(135deg,rgba(255,180,0,.06),var(--panel))}
  .status-tag.used{background:#ffcc00;color:#000}
  .result-card.cancelado{border-color:rgba(255,22,61,.45);background:linear-gradient(135deg,rgba(255,22,61,.05),var(--panel))}
  .status-tag.cancelado{background:var(--red);color:#fff}
  .portaria-extra{margin-top:8px;color:var(--muted);font-size:11px}
  .portaria-extra.ok{color:var(--green)}
  @media(max-width:600px){.portaria-actions{flex-direction:column}.result-card{align-items:stretch;gap:15px;flex-direction:column}.status-area{align-items:stretch}.btn-entry{width:100%}}
</style>
</head>
<body>

<nav class="top-nav">
  <a href="cliente.html">🛒 Comprar</a>
  <a href="admin.html">⚙️ Admin</a>
  <a href="portaria.html" style="color:#fff;border-color:var(--red)">🚪 Portaria</a>
</nav>

<div id="loginScreen">
  <div class="loginBox">
    <h2 style="margin-bottom:5px;color:#fff">PORTARIA // HYPE</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:20px">Acesso da equipe de portaria</p>
    <input type="text" id="portariaUser" placeholder="Utilizador" value="portaria" style="width:100%;height:42px;background:#060608;border:1px solid var(--line);border-radius:9px;padding:0 12px;color:#fff;margin-bottom:10px">
    <input type="password" id="portariaPass" placeholder="Palavra-passe..." autofocus onkeypress="if(event.key === 'Enter') checkPortariaLogin()">
    <button class="btn" onclick="checkPortariaLogin()">ENTRAR NA PORTARIA</button>
  </div>
</div>

<div class="container">
  <header>
    <h1>BOATE <span>HYPE</span> // PORTARIA</h1>
    <p class="sub">Controlo rápido de acessos e validação de ingressos</p>
  </header>

  <div class="search-box">
    <label>Pesquisar Nome, WhatsApp ou ID</label>
    <input type="text" class="search-input" id="portariaSearch" placeholder="Nome, telefone ou #HYPE-123456..." oninput="searchClient()" autocomplete="off">
    <div class="portaria-actions">
      <button class="portaria-btn" onclick="startQrScanner()">📷 LER QR CODE</button>
      <button class="portaria-btn secondary" onclick="document.getElementById('portariaSearch').value=''; searchClient(); stopQrScanner()">LIMPAR</button>
    </div>
    <div id="scannerArea" class="scanner-area">
      <video id="qrVideo" autoplay muted playsinline></video>
      <div class="scanner-line"></div>
      <button class="portaria-btn secondary" onclick="stopQrScanner()">FECHAR CÂMERA</button>
    </div>
  </div>

  <div class="results-grid" id="resultsContainer">
    <div class="empty-state">Comece a digitar o nome do cliente acima para validar a entrada.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

<script src="app.js"></script>
</body>
</html>
