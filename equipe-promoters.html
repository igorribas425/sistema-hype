<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Equipe Hype | Check-in</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d11;color:#fff;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:28px 18px}header{text-align:center}header img{width:170px;height:auto;max-height:120px;object-fit:contain}h1{font-size:29px;margin:18px 0 8px}h2{font-size:20px}p,small{color:#c4c4cc;line-height:1.55}.card{margin:18px 0;background:#19191f;padding:20px;border:1px solid #36363f;border-radius:18px}label{display:block;margin:12px 0;font-size:14px}input{display:block;width:100%;background:#0d0d11;border:1px solid #53535f;border-radius:10px;color:#fff;font:inherit;padding:13px;margin:6px 0}button,a.btn{display:block;width:100%;text-align:center;background:#eae8ee;border:0;color:#161319;font:700 15px system-ui;padding:14px;border-radius:10px;margin:10px 0;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}a.secondary,button.secondary{background:#28282f;color:#eee;border:1px solid #444}#status{overflow-wrap:anywhere}.code{font-family:monospace;color:#fff;letter-spacing:.12em}.bad{color:#ffb6c1}[hidden]{display:none!important}.muted{font-size:12px}.count{display:flex;gap:8px;align-items:center}.count button{width:48px;flex:none;margin:0;background:#303039;color:#fff}.count input{margin:0;text-align:center;font-size:20px}.live{color:#a4f4c2;font-weight:700}#party{font-size:13px}.card h2{margin-top:0}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20261001-v49"></script></head><body><main><header><img src="logo-hype.png" alt="Hype Lounge Club"><h1>Check-in da equipe</h1><p>HYPE • Presença durante a festa</p></header><section class="card"><h2>Seu check-in</h2><p id="party" role="status">Consultando festa...</p><form id="form"><label>Nome do promoter<input id="name" autocomplete="name" required minlength="2" maxlength="100" placeholder="Seu nome"></label><label>Últimos 4 números do WhatsApp<input id="last4" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" required placeholder="0000"></label><label for="guests">Quantas pessoas você está levando?</label><div class="count"><button type="button" id="minus" aria-label="Diminuir quantidade">−</button><input id="guests" type="number" inputmode="numeric" min="0" max="500" step="1" required value="0"><button type="button" id="plus" aria-label="Aumentar quantidade">+</button></div><label style="display:flex;align-items:flex-start;gap:10px"><input id="consent" type="checkbox" style="width:20px;height:20px;flex:none;margin:2px 0"><span>Autorizo o GPS ao vivo para o ADM durante a festa (opcional).</span></label><button id="send" type="submit" disabled>Confirmar check-in</button></form><p id="status" role="status" aria-live="polite"></p><button id="stop" type="button" class="secondary" hidden>Parar e apagar GPS</button><button id="edit" class="secondary" type="button" hidden>Atualizar quantidade de pessoas</button><small class="muted">GPS: mantenha a página aberta. Encerra no fim da festa ou quando você parar.</small></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.HYPE_SUPABASE_CONFIG||{},db=window.supabase.createClient(cfg.url,cfg.anonKey);let token='',active=false,working=false,timer=null,expiry=0,generation=0,party=null,checked=false;function message(t,bad=false){$('status').textContent=t;$('status').className=bad?'bad':'live'}function makeToken(){return Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('')}try{token=sessionStorage.getItem('hype_checkin_token_v4')||'';if(!/^[a-f0-9]{64}$/.test(token)){token=makeToken();sessionStorage.setItem('hype_checkin_token_v4',token)}}catch{token=makeToken()}async function rpc(n,a){const r=await db.rpc(n,a);if(r.error)throw Error(r.error.message);return r.data}async function loadParty(){try{const data=await rpc('hype_collective_party_v3',{});party=Array.isArray(data)?data[0]:data;$('party').textContent=party?party.event_name+' • Até '+new Date(party.ends_at).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}):'Nenhuma festa em andamento.';if(!working)$('send').disabled=!party;return party}catch{party=null;$('party').textContent='Não foi possível consultar a festa.';$('send').disabled=true;return null}}function position(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('GPS indisponível.'));navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.code===1?'Permissão de GPS negada.':'GPS indisponível.')),{enableHighAccuracy:true,timeout:18000,maximumAge:10000})})}function coords(p){return {p_latitude:p.coords.latitude,p_longitude:p.coords.longitude,p_accuracy_m:Math.min(p.coords.accuracy,5000)}}function endGPS(){active=false;generation++;clearInterval(timer);timer=null;$('consent').checked=false;$('stop').hidden=true}async function stopGPS(){endGPS();try{await rpc('hype_collective_stop_v2',{p_token:token});message('Check-in confirmado. GPS encerrado.')}catch{message('Envio interrompido; a posição sai do mapa em até 2 minutos.',true)}}async function update(){if(!active||working)return;if(Date.now()>=expiry){endGPS();message('Festa encerrada. GPS finalizado.');return}const g=generation;working=true;try{const pos=await position();if(!active||g!==generation)return;const ok=await rpc('hype_collective_update_v2',{p_token:token,...coords(pos)});if(!active||g!==generation)return;if(!ok){endGPS();message('Check-in confirmado. GPS encerrado.');return}message('✓ Check-in confirmado • GPS ativo • '+new Date().toLocaleTimeString('pt-BR'))}catch(e){if(active&&g===generation)message('Check-in confirmado. '+e.message,true)}finally{working=false}}$('plus').onclick=()=>{$('guests').value=Math.min(500,Math.max(0,Number($('guests').value)||0)+1)};$('minus').onclick=()=>{$('guests').value=Math.max(0,(Number($('guests').value)||0)-1)};$('form').onsubmit=async e=>{e.preventDefault();if(working||!party)return;working=true;$('send').disabled=true;try{if(!await loadParty())throw Error('Nenhuma festa em andamento.');const name=$('name').value.trim(),last4=$('last4').value,guests=Number($('guests').value);await rpc('hype_team_checkin_v4',{p_token:token,p_name:name,p_phone_last4:last4,p_guests:guests});checked=true;$('edit').hidden=false;$('form').hidden=true;message('✓ Check-in confirmado • '+guests+' convidados informados');if(!$('consent').checked&&active)await stopGPS();if($('consent').checked&&!active){try{const pos=await position();if(!$('consent').checked)return;const exp=await rpc('hype_collective_start_v2',{p_token:token,p_name:name,p_phone_last4:last4,p_consent:true,...coords(pos)});expiry=Date.parse(exp);if(!Number.isFinite(expiry))throw Error('Não foi possível iniciar o GPS.');active=true;generation++;$('stop').hidden=false;message('✓ Check-in confirmado • '+guests+' convidados • GPS ativo');timer=setInterval(update,15000)}catch(err){message('Check-in confirmado. '+err.message,true);$('consent').checked=false}}}catch(err){message(err.message,true)}finally{working=false;$('send').disabled=!party}};$('edit').onclick=()=>{$('form').hidden=false;$('edit').hidden=true;$('send').textContent='Salvar atualização';$('guests').focus()};$('stop').onclick=stopGPS;loadParty();setInterval(()=>{if(!document.hidden)loadParty()},15000);window.addEventListener('pagehide',()=>{clearInterval(timer);active=false;generation++});})();</script></body></html>
