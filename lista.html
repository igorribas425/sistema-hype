<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista HYPE Lounge Club</title>
  <style>
    :root{color-scheme:dark;--bg:#050506;--panel:#111116;--line:#2b2b34;--muted:#a3a3ad;--ok:#28d17c;--red:#ff4d67}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#3d1823 0,#120b10 32%,var(--bg) 68%);font-family:Inter,system-ui,Arial,sans-serif;color:#fff;padding:24px 14px}
    main{width:min(620px,100%);margin:0 auto}.brand{text-align:center}.brand img{width:min(260px,68vw);height:auto}.eyebrow{margin:20px 0 7px;text-align:center;color:#ff6b80;font-size:11px;font-weight:900;letter-spacing:2px}.title{text-align:center;font-size:clamp(25px,6vw,42px);margin:0;letter-spacing:.5px}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.55;margin:11px auto 20px;max-width:480px}.panel{background:rgba(17,17,22,.94);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 55px #0008}.event{border:1px solid rgba(40,209,124,.35);background:rgba(40,209,124,.06);border-radius:11px;padding:12px;margin-bottom:16px;font-size:12px;line-height:1.5}.event strong{display:block;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;letter-spacing:.7px;color:#d8d8df;margin-bottom:6px}input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:#07070a;color:#fff;padding:0 12px;font-size:14px;outline:none}input:focus,select:focus{border-color:#fff}.hint{color:var(--muted);font-size:11px;line-height:1.45;margin:0 0 14px}.btn{width:100%;height:48px;border:0;border-radius:9px;background:linear-gradient(135deg,#fff,#bdbdc3);color:#080808;font-weight:950;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:12px;line-height:1.5}.status.show{display:block}.status.ok{border-color:rgba(40,209,124,.42);color:#a8f5c7;background:rgba(40,209,124,.08)}.status.error{border-color:rgba(255,77,103,.42);color:#ffadb9;background:rgba(255,77,103,.08)}.footer{text-align:center;color:#777;font-size:11px;margin:18px 0}.footer a{color:#fff}.hp{position:absolute;left:-10000px;opacity:0;height:1px;width:1px}
    @media(max-width:520px){body{padding:16px 10px}.panel{padding:15px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="logo-hype.png" alt="HYPE Lounge Club"></div>
    <div class="eyebrow">CADASTRO OFICIAL</div>
    <h1 class="title">Lista HYPE</h1>
    <p class="sub">Preencha seus dados uma vez. O Admin decide quando a lista está liberada para o evento.</p>
    <section class="panel">
      <div id="guestEvent" class="event">Carregando evento disponível...</div>
      <p class="hint">Nome, CPF, WhatsApp e gênero são usados para localizar sua entrada na Portaria. Este link é permanente.</p>
      <form id="guestForm" novalidate>
        <div class="grid">
          <div class="field full"><label for="guestName">NOME COMPLETO</label><input id="guestName" name="name" required autocomplete="name" maxlength="160"></div>
          <div class="field"><label for="guestCpf">CPF</label><input id="guestCpf" name="cpf" required inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00"></div>
          <div class="field"><label for="guestPhone">WHATSAPP</label><input id="guestPhone" name="phone" required inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(00) 00000-0000"></div>
          <div class="field full"><label for="guestGender">GÊNERO</label><select id="guestGender" name="gender" required><option value="">Selecione</option><option value="Feminino">Feminino</option><option value="Masculino">Masculino</option></select></div>
        </div>
        <input id="guestWebsite" name="website" class="hp" tabindex="-1" autocomplete="off">
        <button id="guestSubmit" class="btn" type="submit">ENTRAR NA LISTA</button>
      </form>
      <div id="guestStatus" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20261001-v49"></script>
  <script src="lista-v49.js?v=20261001-v49"></script>
</body>
</html>
